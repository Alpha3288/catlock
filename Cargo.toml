[package]
name = "catlock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
evdev = { version = "0.13.2", features = ["tokio", "stream-trait"] }
gio = { version = "0.22", features = ["v2_80"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
inotify = "0.11.5"
ksni = "0.3.6"
libc = "0.2.191"
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
